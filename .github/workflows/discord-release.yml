# A release, announced on Discord: an embed with the version, its notes (the tag's
# message, docs/git.md) and the downloads, posted to the webhook in the repository's
# DISCORD_RELEASE_WEBHOOK secret. The message is made by discord-release.jq, which
# `gh release view --jq` runs, so it can be tried locally the same way:
#
#   gh release view v0.7.0 --json name,tagName,url,body,publishedAt,isPrerelease,assets \
#     --jq "$(cat .github/discord-release.jq)"
#
# The release workflow publishes with GITHUB_TOKEN, and GitHub starts no workflow on
# events that token causes: a `release: published` trigger alone would never fire for
# ours. So this follows the release workflow's runs, and posts when one succeeds; a
# release published by hand (a draft released from the page) comes as `release`; and
# it can be run by hand with a tag, to post one again.

name: discord release

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "the release's tag, as v0.7.0"
        required: true

jobs:
  announce:
    # the release workflow's run counts only when it made a release: it ran for a tag,
    # and succeeded
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name || github.event.workflow_run.head_branch }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$state" = "true" ]; then
            echo "$TAG is still a draft: nothing to announce"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: announce
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          REPO_RAW: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::no DISCORD_RELEASE_WEBHOOK secret: $TAG is not announced"
            exit 0
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json name,tagName,url,body,publishedAt,isPrerelease,assets \
            --jq "$(cat .github/discord-release.jq)" > message.json
          cat message.json
          curl --fail-with-body -sS -H "Content-Type: application/json" -d @message.json "$WEBHOOK"
