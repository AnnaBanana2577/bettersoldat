# A version tag (v0.1.0) makes a release, one job after another in one run:
#
#   version   the tag is the version in xmake.lua
#   ci        the game built, packed and tested on Windows and Linux (ci.yml), its packages kept
#   release   a GitHub release named after the tag, with the tag's own message as its notes
#             (docs/git.md, Releases), given what `xmake dist` made: for each platform the
#             game (soldatreloaded-<version>-<platform>), its update package (the same,
#             -patch), the server's (-server), and latest-<platform>.txt, the manifest the
#             launcher reads
#   announce  the release on Discord (discord-notify.yml)
#
# Each needs the one before, so a tag whose version is wrong, or whose tests fail, makes no
# release and no announcement.
#
# The launcher asks for releases/latest/download/latest-<platform>.txt, which is the
# newest published release's. So the release is made as a draft, given every file, and
# only then published: a launcher never sees a manifest whose packages aren't there yet.

name: release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: the tag is the version in xmake.lua
        run: |
          version=$(sed -n 's/^set_version("\([^"]*\)")/\1/p' xmake.lua)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME but xmake.lua says $version" >&2
            exit 1
          fi

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      keep-packages: true

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The annotated tag's message is the release's notes.
      - name: the tag's message
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          cat notes.md

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          draft: true
          files: |
            release/*.zip
            release/*.tar.gz
            release/latest-*.txt
          fail_on_unmatched_files: true

      # every file attached: now the launchers may see it
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  announce:
    needs: release
    uses: ./.github/workflows/discord-notify.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
