// seta r_maxfps "500"                       // the frames drawn a second at most, while r_fpslimit is on
// seta r_scenery "1"                        // the scenery behind the map; 0 leaves it out, the middle and front scenery stay
// seta r_screenheight "900"                 // the window's height
// seta r_screenwidth "1600"                 // the window's width
// seta r_swapeffect "0"                     // wait for the display's refresh (vsync)
// seta r_trails "1"                         // the streaks behind the bullets, grenades and rockets; 0 leaves them out
// seta r_weathereffects "1"                 // the map's weather: its rain, sandstorm or snow, and the wind; 0 leaves them out
