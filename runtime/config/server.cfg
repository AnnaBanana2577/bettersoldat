// How this install hosts a game: a dedicated server, and the game's Local Play alike.
// Every setting with what it is, commented out while it holds its default: take a
// line's // off to set it otherwise. Yours to edit: the game changes only the line of a
// setting you change on its Local Play page. The command line (+sv_hostname "...")
// goes over it, and is kept by the game, not by a server. The rotation is
// config/maplist.txt, a map to a line; a weapons mod is config/weapons.ini.

// seta bots_chat "1"                        // whether the bots talk
// seta bots_difficulty "100"                // 300 stupid, 200 poor, 100 normal, 50 hard, 10 impossible
// seta bots_random_alpha "0"                // bots on alpha in capture the flag
// seta bots_random_bravo "0"                // bots on bravo in capture the flag
// seta bots_random_noteam "0"               // bots in a deathmatch
// seta net_floodingpackets "120"            // messages in a second from one player that count as flooding (a client sends sixty)
// seta sv_adminpassword ""                  // the password a player says with /login to be an admin until they leave; empty for none
// seta sv_gamemode "0"                      // 0 the map's own, 1 deathmatch, 2 capture the flag
// seta sv_hostname "Soldat Reloaded server" // the game's name, on the scoreboard
// seta sv_ip ""                             // the address to listen on; empty for every one
// seta sv_killlimit "10"                    // the score that wins a round: kills, or captures in CTF
// seta sv_lobby "https://soldatreloaded-lobby.fly.dev" // the lobby a dedicated server lists itself with
// seta sv_lobby_ip ""                       // the IPv4 address the lobby lists; empty for the one the server reaches it from
// seta sv_password ""                       // the password to join; empty for none. Read live, so a script may set it
// seta sv_port "23073"                      // the UDP port to listen on
// seta sv_public "0"                        // 1: a dedicated server is listed with the lobby, for the game's server browser. Read live
// seta sv_rope "0"                          // 1: the rope is allowed, an experimental gear in place of the jets; 0 gives everyone jets
// seta sv_script "scripts/main.lua"         // the Lua script a dedicated server runs, if the file is there (docs/scripting.md)
// seta sv_timelimit "15"                    // minutes a round lasts
// seta sv_votepercent "60"                  // the percentage of players whose yes passes a vote
// seta sv_warnings_flood "4"                // flood warnings before the player is kicked and barred for a quarter of an hour
