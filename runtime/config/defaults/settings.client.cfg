// SoldatReloaded's default settings for the game: every setting it saves, at its
// default. This file is the game's own: every update replaces it, so a change made here
// is lost. Yours go in config/client/settings.cfg, which the game writes as it closes,
// holding only what you set otherwise than here (in the menus, the console or by hand);
// so a default changed in an update reaches you unless you have set that thing yourself.
// Commands of your own go in config/client/autoexec.cfg, run after everything else.
//
// The game reads, in order: this, binds.client.cfg (the keys), your settings.cfg and
// binds.cfg, your autoexec.cfg, and the command line.
//
//   seta name "value"   sets a cvar the game saves
//   set name "value"    sets one for this run only
//
// The command line goes over all of it: client +map ctf_Ash +r_screenwidth 1920.
// Cvars the game doesn't know yet are kept as set, so a line here can be set before
// the code that reads it exists.

// What the game plays by: maps/, anims/, objects/, bots/. Relative to where the game
// runs, so the same path serves development and a shipped copy.
set data "./data"

// The mod the game looks and sounds like: a folder in mods/, holding only what it changes
// from mods/default/ (the game's own, which every update replaces). Empty for none; it
// takes hold at the next start.
seta cl_mod ""

set map "ctf_Ash"                 // the map to load

// the player
seta cl_player_name "Major"
seta cl_server "127.0.0.1:23073"  // the server the main menu joins, host:port
seta cl_password ""              // and the password it says there, if the server asks one
seta cl_lobby "https://soldatreloaded-lobby.fly.dev" // the lobby the main menu's Servers page asks for its list

// The look: colours as RRGGBB in hex, the styles by number. In a team game the shirt
// is the team's.
seta cl_player_shirt "304289"
seta cl_player_pants "FF0000"
seta cl_player_skin "E6B478"
seta cl_player_hair "000000"
seta cl_player_jet "00008B"     // the jet's flame, once the sparks are drawn
seta cl_grenade_color ""         // everyone's grenades, on the belt and thrown, in this colour, flat and solid;
                                // empty for their own art, as the original draws them
seta cl_cursor_color "FFFFFF"   // the menu cursor's colour, RRGGBB
seta cl_cursor_size "100"       // the menu cursor's size, percent (50-200)
seta cl_crosshair_color "FFFFFF" // the aiming crosshair's colour, RRGGBB
seta cl_crosshair_size "100"    // the aiming crosshair's size, percent (50-200)
seta cl_player_hairstyle "1"    // 0 army, 1-4 the male's (dreadlocks, punk, Mr. T, normal), 5-6 the waifu's (fringe, bob); the rat and the furry wear only army, punk and Mr. T
seta cl_player_headstyle "0"    // 0 none; 1-2 the male's (helmet, hat), 3 the waifu's (her helmet); the rat and the furry wear none
seta cl_player_chainstyle "0"   // 0 none, 1 dog tags, 2 gold chain
seta cl_player_style "0"        // the gostek: 0 male, 1 female, 2 waifu, 3 rat, 4 furry; female and rat wear the male art as a template for now

// The loadout at the next spawn, which the weapons menu sets too. Primaries: 1 Desert
// Eagles, 2 HK MP5, 3 Ak-74, 4 Steyr AUG, 5 Spas-12, 6 Ruger 77, 7 M79, 8 Barrett
// M82A1, 9 FN Minimi, 10 XM214 Minigun. Secondaries: 0 USSOCOM, 1 Combat Knife,
// 2 Chainsaw, 3 LAW.
seta cl_player_wep "7"
seta cl_player_secwep "1"

// The line. Another player is shown where the server last said, stepped on; when
// the next word moves them, the picture glides there over this many milliseconds
// rather than jumping (0 jumps).
seta cl_smooth "100"

// The view can be kept a few ticks behind the newest snapshot, so a late packet is in
// hand before its tick comes; 0 shows each as it arrives, stepping on when one is late.
seta cl_interp "0"

// The radio menu, opened and shut with a key (bind v "+radio" below): a call by its
// number, then a place by its, said together to the team, who hear it over the radio.
seta radio_1 "Enemy flagger"
seta radio_1_1 "up!"
seta radio_1_2 "middle!"
seta radio_1_3 "down!"
seta radio_2 "Friendly flagger"
seta radio_2_1 "up!"
seta radio_2_2 "middle!"
seta radio_2_3 "down!"
seta radio_3 "Enemy spotted"
seta radio_3_1 "up!"
seta radio_3_2 "middle!"
seta radio_3_3 "down!"

// the window
seta r_fullscreen "0"            // 0 windowed, 1 fullscreen, 2 borderless window
seta r_screenwidth "1600"       // the window's size; the fullscreen mode's resolution
seta r_screenheight "900"
seta r_swapeffect "0"           // wait for the display's refresh (vsync)
seta r_fpslimit "1"             // 1: frames drawn at most r_maxfps a second; 0: as fast as they come
seta r_maxfps "500"             // the frames drawn a second at most
seta r_scenery "1"              // the map's scenery, its props; 0 leaves them out for a plainer view
seta r_weathereffects "1"       // the map's weather: its rain, sandstorm or snow, and the wind; 0 leaves them out
seta r_trails "1"               // the streaks behind the bullets, grenades and rockets; 0 leaves them out
seta cl_trackshot "1"           // the camera follows a Barrett shot fired scoped, until you stand up

// The sky: every map's own colours, or with r_forcebg 1 these two on every map, top
// and bottom, as RRGGBB in hex.
seta r_forcebg "0"
seta r_forcebg_color1 "000000"
seta r_forcebg_color2 "000000"

// the mouse
seta cl_sensitivity "0.4"         // the cursor's speed

// the sound
seta snd_volume "18"            // 0 to 100
seta snd_effects_battle "0"     // 1: a far shot or blast also plays its distant sound
seta snd_effects_explosions "0" // 1: a blast next to you rings your ears and muffles the rest a few seconds

// the HUD
seta ui_minimap "0"
seta ui_info "0"                // the FPS and ping line
seta ui_playernames "1"         // teammates' names at the screen's edge when out of view (everyone's,
                                // spectating), and the ping dot
seta ui_console_length "6"      // how many console lines the HUD shows

// Demos: `record [name]` records the game joined until the round ends, `stop` stops
// it, `playdemo <name>` plays one back (or the main menu's Demos page), and
// `demo_tick <tick>` takes it to a tick, 60 a second. They are kept in demos/, as .srdm files.
seta demo_autorecord "0"        // 1: a demo of every round joined

// Local Play: the game the main menu hosts inside the client, on these settings, and
// joins. It plays its rotation's first map first (or `map` with none); when a round ends
// at its score or time limit, or on a vote (/votemap, /votekick), the next in sv_maps
// follows. A dedicated server has its own, in config/defaults/settings.server.cfg.
seta sv_port "23073"             // the UDP port it listens on
seta sv_hostname "SoldatReloaded server" // the name on the scoreboard
seta sv_password ""              // the password to join; empty for none
seta sv_maps ""                  // the rotation, space-separated: "Arena ctf_Ash ctf_Kampf"
seta sv_gamemode "0"             // 0 the map's own (CTF where it has flags, a deathmatch elsewhere), 1 deathmatch, 2 CTF
seta sv_timelimit "15"           // minutes a round lasts
seta sv_killlimit "10"           // the score that wins a round: kills in a deathmatch, captures in CTF
seta sv_votepercent "60"         // the share of the players whose yes passes a map or kick vote
seta sv_rope "0"                 // 1: the rope is allowed, an experimental gear in place of the jets

// The bots (data/bots/*.bot, the original's files), picked at random: so many in a
// deathmatch, so many on each team in CTF. The skill scales their aim, as the
// original's bots_difficulty: 300 stupid, 200 poor, 100 normal, 50 hard, 10 impossible.
seta bots_random_noteam "0"
seta bots_random_alpha "0"
seta bots_random_bravo "0"
seta bots_difficulty "100"
seta bots_chat "1"               // whether they talk
