// bettersoldat's config: every cvar with its default, and every bind. The game reads it at
// start, from the directory it runs in (the project's in development, its own once
// shipped), and on the way out writes back into it: a setting changed in game replaces
// the value here, a key unbound loses its line, and anything new goes at the end.
// Comments and everything else stay as they are.
//
//   seta name "value"   sets a cvar and marks it to be saved
//   set name "value"    sets one the game doesn't save (or for this run only)
//   bind key "text"     the text a key runs; a "+cmd" runs -cmd when the key is released
//
// The command line goes over all of it: client +map ctf_Ash +r_screenwidth 1920.
// Cvars the game doesn't know yet are kept as set, so a line here can be set before
// the code that reads it exists.

// --- client ----------------------------------------------------------------------------

// The game's files: maps/, anims/, objects/, textures/... Relative to where the game
// runs, so the same path serves development and a shipped copy.
set assets "./assets"

set map "ctf_Ash"                 // the map to load

// the player
seta cl_player_name "Major"
seta cl_server "127.0.0.1:23073"  // the server the main menu joins, host:port

// The look: colours as RRGGBB in hex, the styles by number. In a team game the shirt
// is the team's.
seta cl_player_shirt "304289"
seta cl_player_pants "FF0000"
seta cl_player_skin "E6B478"
seta cl_player_hair "000000"
seta cl_player_jet "00008B"     // the jet's flame, once the sparks are drawn
seta cl_player_hairstyle "1"    // 0 army, 1 dreadlocks, 2 punk, 3 Mr. T, 4 normal
seta cl_player_headstyle "0"    // 0 none, 1 helmet, 2 hat; either hides all hair but Mr. T's
seta cl_player_chainstyle "0"   // 0 none, 1 dog tags, 2 gold chain

// The loadout at the next spawn, which the weapons menu sets too. Primaries: 1 Desert
// Eagles, 2 HK MP5, 3 Ak-74, 4 Steyr AUG, 5 Spas-12, 6 Ruger 77, 7 M79, 8 Barrett
// M82A1, 9 FN Minimi, 10 XM214 Minigun. Secondaries: 0 USSOCOM, 1 Combat Knife,
// 2 Chainsaw, 3 LAW.
seta cl_player_wep "8"
seta cl_player_secwep "1"

// The line. Another player is shown where the server last said, stepped on; when
// the next word moves them, the picture glides there over this many milliseconds
// rather than jumping (0 jumps).
seta cl_smooth "100"

// The radio menu, held open with a key (bind alt "+radio" below): a call by its
// number, then a place by its, and the two are said together to the team.
seta radio_1 "Enemy flagger"
seta radio_1_1 "up!"
seta radio_1_2 "middle!"
seta radio_1_3 "down!"
seta radio_2 "Friendly flagger"
seta radio_2_1 "up!"
seta radio_2_2 "middle!"
seta radio_2_3 "down!"
seta radio_3 "Enemy spotted"
seta radio_3_1 "up!"
seta radio_3_2 "middle!"
seta radio_3_3 "down!"

// the window
seta r_fullscreen "0"            // 0 windowed, 1 fullscreen, 2 borderless window
seta r_screenwidth "1600"       // the window's size; the fullscreen mode's resolution
seta r_screenheight "900"
seta r_swapeffect "0"           // wait for the display's refresh (vsync)

// the mouse
seta cl_sensitivity "0.4"         // the cursor's speed

// the sound
seta snd_volume "18"            // 0 to 100

// the HUD
seta ui_minimap "0"
seta ui_info "0"                // the FPS and ping line
seta ui_playernames "0"         // the names over the players
seta ui_console_length "6"      // how many console lines the HUD shows

// The keys, named by their place on the keyboard (SDL's scancodes), so "w" is the key
// above "s" on any layout. Names: letters, digits, f1-f12, space, escape, enter, tab,
// backspace, grave, uparrow, downarrow, leftarrow, rightarrow, shift, rshift, ctrl,
// rctrl, alt, ralt, ins, del, home, end, pgup, pgdn, capslock, minus, equals,
// leftbracket, rightbracket, backslash, semicolon, apostrophe, comma, period, slash,
// kp_enter; mouse1 (left), mouse2 (right), mouse3 (middle), mouse4..., mwheelup,
// mwheeldown. This list is the whole of the binds: a key not bound here does nothing.
unbindall

// the soldier
bind a "+left"
bind d "+right"
bind w "+jump"
bind s "+crouch"
bind x "+prone"
bind mouse1 "+fire"
bind mouse2 "+jet"            // throw a grenade (held to throw further)
bind space "+throw"
bind r "+reload"
bind q "+change"                // switch to the other weapon
bind f "+drop"                  // throw the weapon in hand
bind e "+flagthrow"
bind k "+suicide"
// +flagthrow throws the flag being carried; unbound, as in the original

// the menus
bind escape "escmenu"
bind tab "weaponsmenu"
bind m "teammenu"                // the team, or to watch as a spectator; it opens itself on joining a team game
bind f1 "fragsmenu"             // the scoreboard
bind f2 "statsmenu"             // the weapon stats

// the view
bind f3 "toggle ui_minimap"
bind f4 "toggle r_swapeffect"
bind f5 "toggle ui_info"
bind f7 "toggle ui_playernames"
bind f9 "toggle r_wireframe"    // the map's polygons as lines, for debugging
bind f10 "toggle r_debug"       // spawn points, colliders, special polys, bones

// Talking. A key held with a modifier is bound as "alt+key", "ctrl+key" or "shift+key",
// and falls back to the key's own bind when the combination has none, so Alt+W says
// something and W alone still jumps. `say` speaks to everyone, `say_team` to the team;
// `chat` and `teamchat` open a line to type one, sent with Enter, dropped with Escape;
// `cmd` opens a command line, where a cvar or command runs here and anything else
// goes to the server (/votemap and the like). Tab completes a player's name.
bind t "chat"
bind y "teamchat"
bind slash "cmd"
bind f12 "say /yes"              // a vote's answers; /votemap <map> and /votekick <player> start one
bind f11 "say /no"
bind alt "+radio"               // hold for the radio menu, then a number twice
bind alt+q "say_team Cover me!"
bind alt+w "say_team Follow me!"
bind alt+e "say_team Enemy at our base!"
bind alt+r "say_team Defend the flag!"
bind alt+t "say_team Attack!"
bind alt+z "say_team Help!"
bind alt+x "say_team Got the flag!"
bind alt+c "say_team Flag carrier down!"
bind alt+a "say Nice one!"
bind alt+s "say Sorry!"
bind alt+d "say Thanks!"
bind alt+f "say Damn!"
bind alt+g "say Hi!"
bind alt+h "say Bye!"

// --- server ----------------------------------------------------------------------------

// The server reads this file too, and these are its. It plays `map` (above) first; when
// a round ends at its score or time limit (or on `nextmap`, typed at the server's
// console or voted for), the next map in sv_maps follows, or the same again if the
// list is empty. A vote (/votemap, /votekick in the chat) passes on 51% of the players.
set sv_port "23073"             // the UDP port to listen on
set sv_maps ""                  // the rotation, space-separated: "Arena ctf_Ash ctf_Kampf"

// Still to come here: the mode and the limits, the ban list and the weapon mods.
