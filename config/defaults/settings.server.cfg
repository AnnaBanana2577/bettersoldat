// SoldatReloaded's default settings for a dedicated server. This file is the game's own:
// every update replaces it, so a change made here is lost. Yours go in
// config/server/settings.cfg, which the server reads after this one and never writes;
// set there only what you want otherwise. The command line goes over both:
//   server +sv_hostname "My server" +sv_maps "ctf_Ash ctf_Kampf"
//
// The server's other files, all in config/server/ and all optional:
//   weapons.cfg    a weapons mod: the weapons' numbers, sent to every player who joins
//                  (the defaults, and how to write one: config/defaults/weapons.server.cfg)
//   admins.cfg     who may run the admin commands from the game's chat, a line each by
//                  address: admin 1.2.3.4 "Name". Or set sv_adminpassword below, and a
//                  player says /login <password> to be one until they leave
//   banlist.cfg    the bans, which the server writes as players are banned and unbanned
//   mutelist.cfg   the mutes, likewise; a muted player's chat reaches nobody, rejoining or not
//
// The admin commands, said in the chat with a '/' by an admin, or typed at the server's
// console without one. A player is named by slot, or by name or as much of it as is typed.
//   kick <player> [reason]               ban <player> [minutes] [reason]   (no minutes: for ever)
//   banip <address> [minutes] [reason]   unban <address or name>
//   mute <player>                        unmute <player, address or name>
//   map <name>     the round ends and that map follows (in the chat only)
//   bans  mutes  admins                  the lists
//
// The server plays `map` first; when a round ends at its score or time limit (or on
// `nextmap`, typed at the server's console or voted for), the next map in sv_maps
// follows, or the same again if the list is empty.

set map "ctf_Ash"               // the map played first
set sv_port "23073"             // the UDP port to listen on
set sv_ip ""                    // the address to listen on; empty for every one. A host behind a UDP
                                // proxy that rewrites addresses (fly.io's fly-global-services) must
                                // answer from the one it is reached on, so names it here.
set sv_hostname "SoldatReloaded server" // the name on the scoreboard
set sv_password ""              // the password to join; empty for none. A script may set it as it runs.
set sv_adminpassword ""         // what a player says with /login to become an admin until they leave; empty
                                // for none. Admins by address are listed in config/server/admins.cfg.
set sv_public "0"               // 1: listed with the lobby, for the game's server browser. The dedicated server
                                // only; a game hosted from the menu (Local Play) never is.
set sv_lobby "https://soldatreloaded-lobby.fly.dev" // the lobby it lists itself with
set sv_lobby_ip ""              // the IPv4 address the lobby lists; empty for the one the server reaches it
                                // from. A host behind a proxy that sends from another address than players
                                // reach it on (fly-global-services) names the one they reach.
set sv_maps ""                  // the rotation, space-separated: "Arena ctf_Ash ctf_Kampf"
set sv_gamemode "0"             // 0 the map's own (CTF where it has flags, a deathmatch elsewhere), 1 deathmatch, 2 CTF
set sv_timelimit "15"           // minutes a round lasts
set sv_killlimit "10"           // the score that wins a round: kills in a deathmatch, captures in CTF
set sv_votepercent "60"         // the share of the players whose yes passes a map or kick vote
set net_floodingpackets "120"   // messages in a second from one player that count as flooding; a client sends sixty
set sv_warnings_flood "4"       // flood warnings before the player is kicked and barred for a quarter of an hour
set sv_rope "0"                 // 1: the rope is allowed, an experimental gear in place of the jets

// The bots (assets/bots/*.bot, the original's files), picked at random: so many in a
// deathmatch, so many on each team in CTF. The skill scales their aim, as the
// original's bots_difficulty: 300 stupid, 200 poor, 100 normal, 50 hard, 10 impossible.
set bots_random_noteam "0"
set bots_random_alpha "0"
set bots_random_bravo "0"
set bots_difficulty "100"
set bots_chat "1"               // whether they talk

