// SoldatReloaded's weapons, as the game has them (Soldat 1.7.1's numbers): a `weapon` line
// each. This file is the game's own: every update replaces it, so a change made here is
// lost. A weapons mod goes in config/server/weapons.cfg, which a server reads after this:
// lines in the same form, with only the weapons and the fields you change. The server
// sends its numbers to every player who joins, so a mod plays the same for all of them.
// The cluster grenade and its bomblets follow the frag grenade, the thrown knife the knife.
// Typed at the server's console, `weapon` changes a weapon while the game is on, and
// `weaponlist` shows them all.
//
//   weapon "<name>" <field> <value> [<field> <value>...]
//
//   damage        the hit's strength           speed         the bullet's, out of the muzzle
//   fire_interval ticks between shots          ammo          rounds in the clip
//   reload_time   ticks a reload takes         startup       ticks of wind-up (minigun, LAW, Barrett)
//   bink          aim disturbed: negative a shot's own kick, positive given to its holder when hit
//   movement_acc  inaccuracy while moving      spread        the bullets' spread
//   push          knockback on whom it hits    inherit       share of the shooter's velocity
//   mod_head, mod_chest, mod_legs              the damage on each part, times this

